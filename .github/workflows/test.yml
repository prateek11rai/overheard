name: test

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: overheard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OVERHEARD_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/overheard_test
      OVERHEARD_TEMPORAL_BIN: /home/linuxbrew/.linuxbrew/bin/temporal
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install the Temporal CLI with the runner's Homebrew
        run: /home/linuxbrew/.linuxbrew/bin/brew install temporal
      - name: Enable pgvector in the test database
        run: psql "$OVERHEARD_TEST_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
