services:
  db:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: overheard
      POSTGRES_USER: overheard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overheard -d overheard"]
      interval: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    volumes: [temporal:/data]
    ports: ["127.0.0.1:8233:8233"]

  ollama:
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    volumes: [ollama:/root/.ollama]

  setup:
    build: .
    command: overheard setup
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  worker:
    build: .
    command: overheard worker
    env_file: .env
    volumes: [appdata:/home/app/data]
    depends_on:
      setup: { condition: service_completed_successfully }
      temporal: { condition: service_started }
      ollama: { condition: service_started }
    restart: unless-stopped

  web:
    build: .
    command: overheard web
    env_file: .env
    volumes: [appdata:/home/app/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
    restart: unless-stopped

volumes: { db: {}, temporal: {}, ollama: {}, appdata: {} }
