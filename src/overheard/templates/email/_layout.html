<!doctype html>
<html lang="en" style="background:#181825;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#181825;color:#cdd6f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#181825" style="background:#181825;">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#1e1e2e" style="width:600px;max-width:100%;background:#1e1e2e;border:2px solid #585b70;">
<tr><td style="padding:28px 30px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="26" height="26" bgcolor="#cba6f7" align="center" valign="middle" style="width:26px;height:26px;background:#cba6f7;border:2px solid #11111b;color:#11111b;font:700 22px/26px Georgia,serif;">&#8221;</td>
<td style="padding-left:10px;font:700 16px Menlo,Consolas,monospace;color:#cdd6f4;">overheard</td>
</tr></table>
{% block body %}{% endblock %}
</td></tr>
</table>
<p style="margin:16px 0 0;font-size:12px;color:#7f849c;">Sent by Overheard on your own computer. Change it in Settings.</p>
</td></tr>
</table>
</body>
</html>
