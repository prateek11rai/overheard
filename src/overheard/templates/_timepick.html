<details class="pd timepick" id="timepick"{% if oob %} hx-swap-oob="true"{% endif %}><summary class="timebtn"><span class="v">{{ morning_time }}</span><span class="tz">{{ tz_name }} <span class="tri">▾</span></span></summary>
  <div class="pop timegrid">
    <form hx-post="/api/schedule/time" hx-trigger="change" hx-swap="none"><div class="opts">{% for p in presets %}<label class="opt mono"><input type="radio" name="time" value="{{ p }}"{% if p == morning_time %} checked{% endif %}>{{ p }}</label>{% endfor %}</div></form>
    <div class="row between" style="margin-top:14px"><span class="small dim">Exact time</span><span class="row" style="gap:8px"><button class="btn sm" type="button" hx-post="/api/schedule/step" hx-vals='{"minutes": "-5"}' hx-swap="none" aria-label="5 minutes earlier">−5</button><span class="mono">{{ morning_time }}</span><button class="btn sm" type="button" hx-post="/api/schedule/step" hx-vals='{"minutes": "5"}' hx-swap="none" aria-label="5 minutes later">+5</button></span></div>
    <div class="small dim" style="margin-top:14px">Timezone</div>
        <form class="tzlist" hx-post="/api/schedule/timezone" hx-trigger="change" hx-swap="none">
          <div class="opts">{% for z in tz_choices %}<label class="opt mono sm"><input type="radio" name="tz" value="{{ z }}"{% if z == tz_name %} checked{% endif %}>{{ z }}</label>{% endfor %}</div>
        </form>
  </div>
</details>
