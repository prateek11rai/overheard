[project]
name = "overheard"
version = "0.1.0"
description = "Every morning, what people said about the problem your product solves."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pgvector==0.5.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "temporalio==1.34.0",
    "uvicorn==0.54.0",
]

[project.scripts]
overheard = "overheard.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
exclude-newer = "2026-10-10T00:00:00Z"
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs/design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "S", "SIM"]
ignore = ["D100", "D104", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
